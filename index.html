<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Some Memory Lane</title>

    <link rel="stylesheet" href="style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="../assets//icons/favicon1.png" type="image/x-icon" />
  </head>

  <body>
    <!-- ==========================================
         LANDING PAGE
    =========================================== -->

    <main class="landing-page">
      <!-- ======================================
             MAIN SKETCH
        ======================================= -->
      <!-- ======================================
            MUSIC
        ======================================= -->

      <audio id="backgroundMusic" loop>
        <source src="assets/music/notcuteanymore.mp3" type="audio/mpeg" />
      </audio>

      <button id="musicToggle" class="music-toggle">♫</button>

      <section class="landing-visual">
        <img
          src="assets/images/landing-page.png"
          alt="Some Memory Lane photobooth"
          class="landing-image"
        />

        <!-- START / ENTER -->

        <a href="pages/start.html" class="enter-button">
          <span>Enter</span>

          <span class="enter-arrow">→</span>
        </a>

        <!-- FEATURED STRIPS -->

        <a href="pages/features.html" class="featured-strips">
          <span>Some</span>
          <span>Memories</span>
        </a>
      </section>

      <!-- ======================================
             FOOTER
        ======================================= -->

      <footer class="landing-footer">
        <a href="fallback.html" class="footer-link"> Give Feedback </a>

        <a href="pages/privacy.html" class="footer-link"> Privacy Policy </a>

        <a href="pages/faq.html" class="footer-link"> FAQs </a>

        <a href="pages/about.html" class="footer-link"> About Me </a>

        <a href="fallback.html" class="footer-link"> How it works </a>
      </footer>
    </main>

    <div
      id="portfolioDialog"
      class="portfolio-dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="portfolioDialogTitle"
      aria-describedby="portfolioDialogMessage"
      hidden
    >
      <div class="portfolio-dialog-card">
        <button
          type="button"
          class="portfolio-dialog-close"
          id="portfolioDialogClose"
          aria-label="Stay on Some Memory Lane"
        >
          &times;
        </button>

        <p class="portfolio-dialog-label">A little detour</p>

        <h2 id="portfolioDialogTitle">Leave the photo booth?</h2>

        <p id="portfolioDialogMessage">
          Your memories will stay right here. Would you like to visit my
          portfolio?
        </p>

        <div class="portfolio-dialog-actions">
          <button type="button" class="dialog-button dialog-button-secondary" id="portfolioDialogStay">
            Stay here
          </button>

          <button type="button" class="dialog-button dialog-button-primary" id="portfolioDialogConfirm">
            Visit portfolio <span aria-hidden="true">&#8594;</span>
          </button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
