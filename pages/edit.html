<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Memory | Some Memory Lane</title>


    <!-- ==========================================
         GOOGLE FONTS
    =========================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="../css/edit.css">

</head>


<body>


<!-- ==========================================
     MAIN
========================================== -->

<main class="edit-page">


    <!-- ==========================================
         DEVELOPING SCREEN
    =========================================== -->

    <section
        class="developing-screen"
        id="developingScreen"
    >

        <div class="developing-content">


            <!-- PHOTO ICON -->

            <div class="developing-icon">

                <div class="photo-paper">

                    <span></span>
                    <span></span>
                    <span></span>

                </div>

            </div>


            <!-- LABEL -->

            <p class="section-label">
                SOME MEMORY LANE
            </p>


            <!-- TITLE -->

            <h1>
                Developing your memories...
            </h1>


            <!-- MESSAGE -->

            <p class="developing-message">

                We're putting your photos together
                into your memory strip.

            </p>


            <!-- LOADING DOTS -->

            <div class="loading-dots">

                <span></span>
                <span></span>
                <span></span>
                <span></span>

            </div>


            <!-- PROGRESS -->

            <div class="developing-progress">

                <div
                    class="developing-progress-fill"
                    id="developingProgress"
                ></div>

            </div>


            <!-- STATUS -->

            <p
                class="developing-status"
                id="developingStatus"
            >
                Preparing your photos...
            </p>


        </div>

    </section>



    <!-- ==========================================
         RESULT SCREEN
    =========================================== -->

    <section
        class="result-screen"
        id="resultScreen"
    >


        <!-- ======================================
             RESULT HEADER
        ======================================= -->

        <div class="result-header">

            <p class="section-label">
                YOUR MEMORY
            </p>


            <h1>
                Your strip is ready!
            </h1>


            <p>
                Your memories have been developed.
            </p>

        </div>



        <!-- ======================================
             STRIP
        ======================================= -->

        <div class="strip-stage">

            <div
                class="final-strip"
                id="finalStrip"
            >

                <!-- Generated by edit.js -->

            </div>

        </div>



        <!-- ======================================
             ACTIONS
        ======================================= -->

        <div class="result-actions">


            <button
                type="button"
                class="secondary-btn"
                id="downloadButton"
            >

                ↓ Download

            </button>


            <button
                type="button"
                class="primary-btn"
                id="printButton"
            >

                Print Strip

            </button>


            <a
                href="../index.html"
                class="secondary-btn"
                id="finishButton"

            >

                Finish

            </a>


        </div>


    </section>


</main>



<!-- ==========================================
     JAVASCRIPT
========================================== -->

<script src="../js/edit.js"></script>


</body>

</html>
