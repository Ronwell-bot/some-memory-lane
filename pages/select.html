<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Photos | Memory Lane</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">Memory Lane</div>
            <a href="../camera/camera.html" class="back-home-btn">Back to Camera</a>
        </nav>
    </header>

    <main class="page-shell">
        <div class="page-card select-card">
            <div class="select-header">
                <p class="session-kicker">Choose Photos</p>
                <h1>Select the photos for your film strip</h1>
                <p>
                    Pick the photos you want to include in the final layout.
                </p>
            </div>

            <div class="select-summary">
                <div><span>Layout</span><strong id="selectLayout">Classic Strip</strong></div>
                <div><span>Need</span><strong id="selectNeed">4</strong></div>
                <div><span>Captured</span><strong id="selectCaptured">0</strong></div>
                <div><span>Selected</span><strong id="selectChosen">0</strong></div>
            </div>

            <div class="select-note" id="selectNote">
                Choose your best photos for the strip.
            </div>

            <div class="selection-grid" id="selectionGrid"></div>

            <div class="selection-actions">
                <button type="button" class="secondary-btn" id="retakeSession">Retake Session</button>
                <button type="button" class="primary-btn" id="saveSelection">Save Selection</button>
            </div>

            <p class="selection-status" id="selectionStatus"></p>
        </div>
    </main>

    <script src="../select.js"></script>
</body>
</html>
