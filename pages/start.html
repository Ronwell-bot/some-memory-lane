<!doctype html>

    <!-- ==========================================
         CSS
    =========================================== -->

    <link rel="stylesheet" href="../css/start.css" />

    <!-- ==========================================
         FONTS
    =========================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- ==========================================
         HEADER
    =========================================== -->

    <header>
      <nav class="navbar">
        <a href="../index.html" class="logo"> Some Memory Lane </a>

        <a href="../index.html" class="start-btn">Home </a>
      </nav>
    </header>

    <!-- ==========================================
         START PAGE
    =========================================== -->

    <main class="start-page">
      <!-- ==========================================
             STEP 1 — CHOOSE SESSION
        =========================================== -->

      <section class="setup-step active" id="sessionStep">
        <div class="step-heading">
          <span class="step-label"> 01 </span>

          <h1>Choose Your Session</h1>

          <p>How are you making memories today?</p>
        </div>

        <div class="selection-window session-window">
          <div class="session-options">
            <!-- ==================================
                         SOLO
                    =================================== -->

            <button
              type="button"
              class="session-card selected"
              data-session="Solo"
              id="soloBtn"
            >
              <span class="session-icon"> ◉ </span>

              <strong> Solo </strong>

              <small> Just me </small>
            </button>

            <!-- ==================================
                         DUO
                    =================================== -->

            <button type="button" class="session-card" data-session="Duo">
              <span class="session-icon"> ◉◉ </span>

              <strong> Duo </strong>

              <small> Two people </small>
            </button>

            <!-- ==================================
                         GROUP
                    =================================== -->

            <button
              type="button"
              class="session-card"
              data-session="Group"
              id="groupBtn"
            >
              <span class="session-icon"> ◉◉◉◉ </span>

              <strong> Group </strong>

              <small> Friends & family </small>
            </button>
          </div>

          <!-- ==================================
                     GROUP OPTIONS
                =================================== -->

          <div class="group-options" id="groupOptions">
            <div class="group-divider"></div>

            <p id="sessionAvailabilityMessage">
              Duo and group sessions are coming soon.
            </p>

            <div class="room-actions">
              <button type="button" class="room-btn disabled-room" disabled>
                Create Room
              </button>

              <span> or </span>

              <div class="join-room">
                <input type="text" placeholder="Enter room code" disabled />

                <button type="button" class="room-btn disabled-room" disabled>
                  Join
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- ==================================
                 CONTINUE
            =================================== -->

        <div class="step-action">
          <button type="button" class="continue-btn" id="sessionContinue">
            Continue
          </button>
        </div>
      </section>

      <!-- ==========================================
             STEP 2 — CHOOSE LAYOUT + DESIGN
        =========================================== -->

          <span class="step-label"> 02 </span>

          <h1>Choose Your Strip</h1>

        </div>
