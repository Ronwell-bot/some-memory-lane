    <!-- ==========================================
         FRESH SESSION RESET
    =========================================== -->

    <script>

        /*
            Every time the user starts a new
            photobooth session, remove any
            photos left over from a previous
            session.

            Capture phase is used so this runs
            BEFORE the normal start.js click
            handler.
        */

        const layoutContinue =
            document.getElementById(
                "layoutContinue"
            );


        if(layoutContinue){

            layoutContinue.addEventListener(

                "click",

                function(){

                    console.log(
                        "Starting a fresh Memory Lane session..."
                    );


                    /*
                        Remove old camera photos.
                    */

                    localStorage.removeItem(
                        "memoryLanePhotos"
                    );


                    /*
                        Remove old session data.
                    */

                    sessionStorage.removeItem(
                        "memoryLaneSession"
                    );


                    console.log(
                        "Old session data cleared."
                    );

                },

                true

            );

        }

    </script>
