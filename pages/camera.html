<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Camera | Memory Lane</title>

    <!-- ==========================================
         CSS
    =========================================== -->

    <link rel="stylesheet" href="../css/camera.css" />
    <link rel="stylesheet" href="../css/music.css" />
    <link rel="stylesheet" href="../css/tape.css?v=20261001" />

    <!-- ==========================================
         FONTS
    =========================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="../assets//icons/favicon3.png" type="image/x-icon" />
  </head>

  <body>
    <!-- ==========================================
         HEADER
    =========================================== -->

    <header>
      <nav class="navbar">
        <div class="logo">
          <span> Some Memory Lane </span>
        </div>

        <a href="../pages/start.html" class="start-btn">Back </a>
      </nav>
    </header>

    <!-- ==========================================
         CAMERA PAGE
    =========================================== -->

    <section class="camera-page">
      <!-- ======================================
             SESSION INFORMATION
        ======================================= -->

      <div class="session-info">
        <!-- Selected Layout -->

        <div>
          <h2 id="layoutName">Classic Strip</h2>

          <p id="captureInfo">4 Photos Required</p>
        </div>

        <!-- Camera Status -->

        <div class="status" role="status" aria-live="polite">
        <div class="light red" id="statusLight" aria-hidden="true"></div>

          <span id="statusText"> Camera Off </span>
        </div>
      </div>

      <!-- ======================================
             CAMERA CONTROLS
        ======================================= -->

      <div class="camera-power">
        <div class="camera-power-copy">
          <p class="camera-power-label">Camera Controls</p>
        </div>

        <div class="camera-power-request">
          <div class="camera-power-buttons">
            <!-- Request Permission -->

            <button
              id="requestCamera"
              class="power-btn primary-power-btn"
              type="button"
            >
              Request Camera Access
            </button>

            <!-- Turn On -->

            <button id="turnOnCamera" class="power-btn" type="button">
              Turn Camera On
            </button>

            <!-- Turn Off -->

            <button id="turnOffCamera" class="power-btn" type="button">
              Turn Camera Off
            </button>
          </div>
        </div>
      </div>

      <!-- ======================================
             CAMERA PREVIEW
        ======================================= -->

      <div class="camera-stage">
        <div class="camera-container">
          <!-- Camera -->

          <video
            id="video"
            autoplay
            playsinline
            muted
            aria-label="Live camera preview"
          ></video>

          <!-- Flash Effect -->

          <div id="flash"></div>

          <!-- Countdown -->

          <div id="countdown" aria-live="assertive" aria-atomic="true">3</div>

          <!-- Camera Overlay -->

          <div class="camera-overlay">
            <div class="photo-progress">
              Photo

              <span id="currentPhoto"> 1 </span>

              /

              <span id="totalPhotos"> 4 </span>
            </div>
          </div>
        </div>

        <section
          class="capture-review"
          id="captureReview"
          hidden
          aria-labelledby="captureReviewTitle"
        >
          <div>
            <h2 id="captureReviewTitle">Captured</h2>
            <p>Your photos will be arranged automatically.</p>
          </div>
          <div
            class="capture-thumbnails"
            id="captureThumbnails"
            aria-label="Captured photo thumbnails"
          ></div>
        </section>
      </div>

      <!-- ======================================
             CAPTURE CONTROLS
        ======================================= -->

      <div class="controls">
        <button id="startCapture" type="button">Start Countdown</button>

        <button id="retakeSession" type="button">Restart Session</button>

        <button id="uploadInstead" type="button" class="upload-btn">
          Upload Instead
        </button>
      </div>

      <section class="upload-panel" id="uploadPanel" hidden aria-labelledby="uploadTitle">
        <div class="upload-panel-heading">
          <h2 id="uploadTitle">Choose Your Photos</h2>
          <p id="uploadStatus">Select up to the required number of photos.</p>
        </div>
        <input
          id="photoUpload"
          type="file"
          accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp"
          multiple
          hidden
        />
        <div class="upload-actions">
          <button id="choosePhotos" type="button">Choose Photos</button>
          <button id="createUploadedStrip" type="button" disabled>
            Create My Strip
          </button>
        </div>
        <div
          class="upload-thumbnails"
          id="uploadThumbnails"
          aria-live="polite"
          aria-label="Uploaded photo previews"
        ></div>
      </section>

      <!-- ======================================
             HIDDEN CANVAS
        ======================================= -->

      <canvas id="canvas" style="display: none"></canvas>
    </section>

    <!-- ==========================================
         JAVASCRIPT
    =========================================== -->

    <script src="../js/strip-catalog.js"></script>
    <script src="../js/photo-storage.js"></script>
    <script src="../js/session-music.js"></script>
    <script src="../js/camera.js"></script>
  </body>
</html>
